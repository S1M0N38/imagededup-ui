[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "imagededup-ui"
version = "0.0.1"
description = "UI for image deduplication"
readme = "README.md"
authors = [ { name = "S1M0N38", email = "bertolottosimone@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [  ]
urls.Changelog = "https://github.com/S1M0N38/imagededup-ui/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/S1M0N38/imagededup-ui"
urls.Issues = "https://github.com/S1M0N38/imagededup-ui/issues"
urls.Repository = "https://github.com/S1M0N38/imagededup-ui"
scripts.imagededup-ui = "imagededup_ui:main"

[dependency-groups]
dev = [
  "commitizen>=4.11",
  "google-yamlfmt>=0.21",
  "mdformat>=0.7.22,<0.8",
  "mdformat-footnote>=0.1.2",
  "mdformat-frontmatter>=2.0.8",
  "mdformat-gfm>=1",
  "mdformat-gfm-alerts>=2",
  "mdformat-simple-breaks>=0.0.1",
  "prek>=0.3.1",
  "pyproject-fmt>=2.11.1",
  "ruff>=0.14.13",
  "ty>=0.0.12",
]
test = [ "pytest>=9.0.2" ]

[tool.ruff]
lint.extend-select = [ "I" ]
lint.task-tags = [ "FIX", "HACK", "NOTE", "PERF", "TEST", "TODO", "WARN" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
markers = [ "dev: marks tests that are currently developed" ]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
schema_pattern = "^(feat|fix|docs|chore|test|refactor|perf|ci|build|style)(\\((.*?)\\))?!?:\\s.+"
message_max_length = 72
